<script>

const listenerURL = "https://arbiter-prod-ce.cloud.automationanywhere.digital/webhook/incoming/3wo3xib5YAK5mY5FH87Z3SoXM3RgLwYVlx5oHR6O7SdXV6Rc5FmkVbP3YvO5GEYBJMeX3G5E6krxVTuyZvtTibuB3uRVgplhJYdVNDwWYP56voUOCSXYOpDfOFRsxkpF";

document.getElementById("travelForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const employeeName = document.getElementById("employeeName").value;
    const destination = document.getElementById("destination").value;
    const travelDate = document.getElementById("travelDate").value;
    const travelPurpose = document.getElementById("travelPurpose").value;

    const data = {
        employeeName: employeeName,
        destination: destination,
        travelDate: travelDate,
        travelPurpose: travelPurpose
    };

    try {

        const response = await fetch(listenerURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.text();

        alert("Travel request submitted successfully!");

        console.log("Automation Anywhere Response:", result);

    } catch (error) {

        console.error("Error:", error);

        alert("Error sending travel request: " + error.message);

    }

});

</script>
